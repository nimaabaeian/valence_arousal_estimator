channels:
  - conda-forge
  - defaults
  - pytorch
  - nvidia
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - pytorch::pytorch=2.0.0
  - pytorch::pytorch-cuda=11.8
  - libjpeg-turbo  # Explicit libjpeg to fix symbol conflicts
  - libtiff  # Explicit libtiff for compatibility
  - opencv  # Required for cv2.resize
  - intel-openmp  # Required for MKL support

# Note: YARP Python bindings must be installed separately
# Install YARP from system packages or build from source with Python bindings enabled
# See: https://www.yarp.it/latest/install.html
